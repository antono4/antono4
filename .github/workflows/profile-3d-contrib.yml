name: 3D Contrib SVGs (night-green, gitblock) Every 10 Minutes

on:
  schedule:
    # setiap 10 menit, digeser 4 menit dari mark :00/:10/... agar tidak bentrok
    - cron: '4-59/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-3d-contrib
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate 3D-Contrib SVGs
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add profile-3d-contrib/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # Simpan hasil generate dulu, lalu tulis ulang di atas commit terbaru remote
          # supaya push tidak ditolak saat workflow lain menulis ke main bersamaan.
          mkdir -p /tmp/profile-3d
          cp -R profile-3d-contrib/. /tmp/profile-3d/

          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3 4 5; do
            git fetch --quiet "$remote" main
            git reset --quiet --hard FETCH_HEAD
            cp -R /tmp/profile-3d/. profile-3d-contrib/

            git add profile-3d-contrib/
            if git diff --staged --quiet; then
              echo "Tidak ada perubahan untuk di-commit"
              exit 0
            fi
            git commit --quiet -m "chore: regenerate 3D contrib SVGs [skip ci]"

            if git push --quiet "$remote" "HEAD:main"; then
              echo "Push berhasil pada percobaan $attempt"
              exit 0
            fi

            echo "Push ditolak (percobaan $attempt), menyinkron ulang..."
            sleep "$((RANDOM % 5 + 2))"
          done

          echo "Push gagal setelah 5 percobaan" >&2
          exit 1
