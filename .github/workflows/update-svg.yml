name: Update SVG Every 5 Minutes

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-svg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0

      - name: Update SVG timestamp
        run: |
          # Get current timestamp
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          # SVG file path
          SVG_FILE="assets/contrib-3d.svg"
          
          # Check if file exists
          if [ -f "$SVG_FILE" ]; then
            # Remove existing timestamp comment if present
            sed -i '/^<!-- Last Updated:.*-->$/d' "$SVG_FILE"
            
            # Add new timestamp comment at the beginning (after XML declaration or at the very start)
            if head -1 "$SVG_FILE" | grep -q '^<?xml'; then
              # XML declaration exists, add comment after it
              sed -i '1a<!-- Last Updated: '"$TIMESTAMP"' -->' "$SVG_FILE"
            else
              # No XML declaration, add comment at the very start
              sed -i '1i<!-- Last Updated: '"$TIMESTAMP"' -->' "$SVG_FILE"
            fi
            
            echo "Updated SVG with timestamp: $TIMESTAMP"
          else
            echo "SVG file not found: $SVG_FILE"
            exit 1
          fi

      - name: Commit and push changes
        run: |
          git config --local user.name "GitHub Actions Bot"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          git add assets/contrib-3d.svg
          git diff --staged --quiet || git commit -m "chore: update contrib-3d.svg timestamp [skip ci]"
          git push
