name: Regenerate Contribution SVG Every 5 Minutes

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  regenerate-svg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: |
          npm init -y
          npm install graphql-request graphql

      - name: Regenerate SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > generate-contrib.js << 'EOFJS'
          const { GraphQLClient, gql } = require('graphql-request');
          
          const endpoint = 'https://api.github.com/graphql';
          const token = process.env.GITHUB_TOKEN;
          const client = new GraphQLClient(endpoint, {
            headers: {
              authorization: `Bearer ${token}`,
            },
          });
          
          const USERNAME = 'antono4';
          
          const query = gql`
            query($username: String!) {
              user(login: $username) {
                contributionsCollection {
                  contributionCalendar {
                    totalContributions
                    weeks {
                      contributionDays {
                        contributionCount
                        date
                      }
                    }
                  }
                }
              }
            }
          `;
          
          async function generateSVG() {
            const data = await client.request(query, { username: USERNAME });
            const user = data.user;
            const calendar = user.contributionsCollection.contributionCalendar;
            
            const weeks = calendar.weeks;
            const totalContributions = calendar.totalContributions;
            const firstDay = weeks[0].contributionDays[0].date;
            const lastDay = weeks[weeks.length - 1].contributionDays[weeks[weeks.length - 1].contributionDays.length - 1].date;
            
            // Generate activity graph SVG (GitHub Activity Graph style)
            const svg = generateActivityGraphSVG({
              weeks,
              totalContributions,
              firstDay,
              lastDay
            });
            
            const fs = require('fs');
            fs.writeFileSync('assets/contrib-3d.svg', svg);
            console.log('SVG generated successfully!');
            console.log(`Total contributions: ${totalContributions}`);
          }
          
          function generateActivityGraphSVG({ weeks, totalContributions, firstDay, lastDay }) {
            // Dracula theme colors
            const colors = {
              bg: '#282a36',
              text: '#f8f8f2',
              textMuted: '#6272a4',
              line: '#44475a',
              area: '#50fa7b',
              dot: '#8be9fd'
            };
            
            const width = 1280;
            const height = 300;
            const padding = { top: 40, right: 40, bottom: 60, left: 60 };
            const graphWidth = width - padding.left - padding.right;
            const graphHeight = height - padding.top - padding.bottom;
            
            // Extract daily contributions
            const dailyData = [];
            let maxContrib = 0;
            let totalDaily = 0;
            
            weeks.forEach((week) => {
              week.contributionDays.forEach((day) => {
                if (day.contributionCount > 0) {
                  dailyData.push({
                    count: day.contributionCount,
                    date: day.date
                  });
                  maxContrib = Math.max(maxContrib, day.contributionCount);
                  totalDaily += day.contributionCount;
                }
              });
            });
            
            if (maxContrib === 0) maxContrib = 1;
            
            // Generate area path
            let areaPath = `M ${padding.left} ${height - padding.bottom}`;
            let linePath = '';
            
            dailyData.forEach((day, i) => {
              const x = padding.left + (i / (dailyData.length - 1 || 1)) * graphWidth;
              const y = height - padding.bottom - (day.count / maxContrib) * graphHeight;
              
              if (i === 0) {
                areaPath += ` L ${x} ${y}`;
                linePath = `M ${x} ${y}`;
              } else {
                areaPath += ` L ${x} ${y}`;
                linePath += ` L ${x} ${y}`;
              }
            });
            
            // Close area path
            if (dailyData.length > 0) {
              const lastX = padding.left + graphWidth;
              areaPath += ` L ${lastX} ${height - padding.bottom} Z`;
            }
            
            // Generate month labels
            const months = [];
            let currentMonth = '';
            weeks.forEach((week, weekIndex) => {
              const firstDayOfWeek = week.contributionDays[0];
              if (firstDayOfWeek && firstDayOfWeek.date) {
                const month = firstDayOfWeek.date.substring(0, 7);
                if (month !== currentMonth) {
                  currentMonth = month;
                  const x = padding.left + (weekIndex / weeks.length) * graphWidth;
                  months.push({ month: month.substring(5), x });
                }
              }
            });
            
            // Stats
            const displayTotal = totalContributions.toLocaleString();
            
            return `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">
          <style>
            * { font-family: 'Segoe UI', 'Ubuntu', sans-serif; }
          </style>
          <defs>
            <linearGradient id="areaGradient" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="${colors.area}" stop-opacity="0.4"/>
              <stop offset="100%" stop-color="${colors.area}" stop-opacity="0"/>
            </linearGradient>
          </defs>
          
          <!-- Background -->
          <rect x="0" y="0" width="${width}" height="${height}" fill="${colors.bg}" rx="8"/>
          
          <!-- Title -->
          <text x="${padding.left}" y="30" fill="${colors.text}" font-size="18" font-weight="bold">${USERNAME}'s GitHub Activity</text>
          <text x="${width - padding.right}" y="30" fill="${colors.textMuted}" font-size="14" text-anchor="end">${displayTotal} contributions in the last year</text>
          
          <!-- Grid lines -->
          <line x1="${padding.left}" y1="${padding.top}" x2="${padding.left}" y2="${height - padding.bottom}" stroke="${colors.line}" stroke-width="1"/>
          <line x1="${padding.left}" y1="${height - padding.bottom}" x2="${width - padding.right}" y2="${height - padding.bottom}" stroke="${colors.line}" stroke-width="1"/>
          
          <!-- Y-axis labels -->
          <text x="${padding.left - 10}" y="${padding.top}" fill="${colors.textMuted}" font-size="12" text-anchor="end" dominant-baseline="middle">${maxContrib}</text>
          <text x="${padding.left - 10}" y="${height - padding.bottom}" fill="${colors.textMuted}" font-size="12" text-anchor="end" dominant-baseline="middle">0</text>
          
          <!-- Area fill -->
          ${dailyData.length > 0 ? `<path d="${areaPath}" fill="url(#areaGradient)"/>` : ''}
          
          <!-- Line -->
          ${dailyData.length > 0 ? `<path d="${linePath}" fill="none" stroke="${colors.area}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>` : ''}
          
          <!-- Month labels -->
          ${months.map(m => `<text x="${m.x}" y="${height - padding.bottom + 20}" fill="${colors.textMuted}" font-size="12" text-anchor="middle">${m.month}</text>`).join('')}
          
          <!-- Date range -->
          <text x="${width - padding.right}" y="${height - 15}" fill="${colors.textMuted}" font-size="11" text-anchor="end">${firstDay} / ${lastDay}</text>
          
          <!-- Legend dots on the line -->
          ${dailyData.length > 0 ? dailyData.filter((_, i) => i % Math.max(1, Math.floor(dailyData.length / 20)) === 0 || i === dailyData.length - 1).map((day, i, arr) => {
            const idx = dailyData.indexOf(day);
            const x = padding.left + (idx / (dailyData.length - 1 || 1)) * graphWidth;
            const y = height - padding.bottom - (day.count / maxContrib) * graphHeight;
            return `<circle cx="${x}" cy="${y}" r="4" fill="${colors.dot}"/>`;
          }).join('') : ''}
          </svg>`;
          }
          
          generateSVG().catch(console.error);
          EOFJS
          
          node generate-contrib.js

      - name: Commit and push
        run: |
          git add assets/contrib-3d.svg
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: regenerate contrib-3d.svg with latest data [skip ci]"
            git push
            echo "SVG updated successfully!"
          fi
