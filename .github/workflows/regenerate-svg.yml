name: Regenerate Contribution SVG Every 5 Minutes

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  regenerate-svg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: |
          npm init -y
          npm install graphql-request graphql

      - name: Regenerate SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > generate-contrib.js << 'ENDSCRIPT'
          const { GraphQLClient, gql } = require('graphql-request');
          
          const endpoint = 'https://api.github.com/graphql';
          const token = process.env.GITHUB_TOKEN;
          const client = new GraphQLClient(endpoint, {
            headers: {
              authorization: 'Bearer ' + token,
            },
          });
          
          const USERNAME = 'antono4';
          
          const query = gql`
            query($username: String!) {
              user(login: $username) {
                contributionsCollection {
                  contributionCalendar {
                    totalContributions
                    weeks {
                      contributionDays {
                        contributionCount
                        date
                      }
                    }
                  }
                  commitContributionsByRepository(maxRepositories: 100) {
                    contributions {
                      totalCount
                    }
                  }
                  issueContributions(first: 100) {
                    totalCount
                  }
                  pullRequestContributions(first: 100) {
                    totalCount
                  }
                  pullRequestReviewContributions(first: 100) {
                    totalCount
                  }
                  repositoryContributions(first: 100) {
                    totalCount
                  }
                }
                repositories(first: 100, orderBy: {field: STARGAZERS, direction: DESC}) {
                  nodes {
                    name
                    stargazerCount
                    primaryLanguage {
                      name
                      color
                    }
                  }
                }
              }
            }
          `;
          
          async function generateSVG() {
            try {
              const data = await client.request(query, { username: USERNAME });
              const user = data.user;
              const calendar = user.contributionsCollection.contributionCalendar;
              
              const weeks = calendar.weeks;
              const totalContributions = calendar.totalContributions;
              const commits = user.contributionsCollection.commitContributionsByRepository.reduce((sum, r) => sum + r.contributions.totalCount, 0);
              const issues = user.contributionsCollection.issueContributions.totalCount;
              const prs = user.contributionsCollection.pullRequestContributions.totalCount;
              const reviews = user.contributionsCollection.pullRequestReviewContributions.totalCount;
              
              // Get languages
              const reposWithLang = user.repositories.nodes.filter(r => r.primaryLanguage);
              const langCounts = {};
              reposWithLang.forEach(r => {
                const lang = r.primaryLanguage.name;
                if (!langCounts[lang]) langCounts[lang] = { count: 0, color: r.primaryLanguage.color };
                langCounts[lang].count += 1;
              });
              const topLangs = Object.entries(langCounts).sort((a, b) => b[1].count - a[1].count).slice(0, 6);
              
              const firstDay = weeks[0].contributionDays[0].date;
              const lastDay = weeks[weeks.length - 1].contributionDays[weeks[weeks.length - 1].contributionDays.length - 1].date;
              
              // Generate 3D isometric SVG
              const svg = generateIsometricSVG({
                weeks,
                totalContributions,
                commits,
                issues,
                prs,
                reviews,
                topLangs,
                firstDay,
                lastDay
              });
              
              const fs = require('fs');
              fs.writeFileSync('assets/contrib-3d.svg', svg);
              console.log('SVG generated successfully!');
              console.log('Total contributions:', totalContributions);
            } catch (err) {
              console.error('Error generating SVG:', err.message);
              process.exit(1);
            }
          }
          
          function generateIsometricSVG({ weeks, totalContributions, commits, issues, prs, reviews, topLangs, firstDay, lastDay }) {
            // Dracula theme colors
            const colors = {
              bg: '#282a36',
              text: '#f8f8f2',
              textMuted: '#6272a4',
            };
            
            const width = 1280;
            const height = 850;
            
            // Calculate max contribution for scaling
            const dayContribs = [];
            weeks.forEach((week) => {
              week.contributionDays.forEach((day) => {
                dayContribs.push(day.contributionCount);
              });
            });
            const maxDaily = Math.max(...dayContribs, 1);
            
            // Generate patterns for contribution levels
            let patterns = '';
            const levels = [
              { name: '0', top: '#f8f8f8', left: 'rgb(174, 174, 174)', right: 'rgb(207, 207, 207)' },
              { name: '1', top: '#9be9a8', left: 'rgb(64, 194, 99)', right: 'rgb(104, 214, 143)' },
              { name: '2', top: '#40c463', left: 'rgb(48, 161, 78)', right: 'rgb(85, 187, 120)' },
              { name: '3', top: '#216e39', left: 'rgb(33, 110, 57)', right: 'rgb(65, 138, 94)' },
              { name: '4', top: '#40a02b', left: 'rgb(46, 160, 67)', right: 'rgb(78, 176, 99)' }
            ];
            
            levels.forEach((level) => {
              patterns += '<pattern id="pattern_' + level.name + '_top" x="0" y="0" width="32" height="16" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="32" height="16" fill="' + level.top + '"/></pattern>';
              patterns += '<pattern id="pattern_' + level.name + '_left" x="0" y="0" width="32" height="16" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="32" height="16" fill="' + level.left + '"/></pattern>';
              patterns += '<pattern id="pattern_' + level.name + '_right" x="0" y="0" width="32" height="16" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="32" height="16" fill="' + level.right + '"/></pattern>';
            });
            
            // Generate isometric blocks
            let blocks = '';
            const startX = 140;
            const startY = 154;
            const xStep = 20;
            const yStep = 12;
            
            weeks.forEach((week, weekIndex) => {
              week.contributionDays.forEach((day, dayIndex) => {
                const x = startX + (6 - dayIndex) * xStep + weekIndex * xStep;
                const y = startY + weekIndex * yStep;
                
                let contribLevel = 0;
                if (day.contributionCount > 0) {
                  const ratio = day.contributionCount / maxDaily;
                  if (ratio > 0.75) contribLevel = 4;
                  else if (ratio > 0.5) contribLevel = 3;
                  else if (ratio > 0.25) contribLevel = 2;
                  else contribLevel = 1;
                }
                
                const blockHeight = 4.62 + contribLevel * 60;
                
                blocks += '<g transform="translate(' + x + ' ' + y + ')">';
                blocks += '<rect x="0" y="0" width="32" height="32" transform="skewY(-30) skewX(40.89) scale(0.56 0.65)" fill="url(#pattern_' + contribLevel + '_top)"/>';
                blocks += '<rect x="0" y="0" width="32" height="' + blockHeight + '" transform="skewY(30) scale(0.56 0.65)" fill="url(#pattern_' + contribLevel + '_left)"/>';
                blocks += '<rect x="0" y="0" width="32" height="' + blockHeight + '" transform="translate(18 10.39) skewY(-30) scale(0.56 0.65)" fill="url(#pattern_' + contribLevel + '_right)"/>';
                blocks += '</g>';
              });
            });
            
            // Language bars
            let langBars = '';
            const langColors = ['#e34c26', '#3178c6', '#f1e05a', '#3572A5', '#4F5D95', '#444444'];
            topLangs.forEach((lang, i) => {
              const name = lang[0];
              const data = lang[1];
              langBars += '<rect x="0" y="' + (37 + i * 33) + '" width="22" height="22" fill="' + (data.color || langColors[i]) + '"/>';
              langBars += '<text x="28" y="' + (48 + i * 33) + '" fill="' + colors.text + '" font-size="18">' + name + '</text>';
            });
            
            const displayTotal = totalContributions.toLocaleString();
            
            return '<svg xmlns="http://www.w3.org/2000/svg" width="' + width + '" height="' + height + '" viewBox="0 0 ' + width + ' ' + height + '">' +
              '<style>* { font-family: "Segoe UI", "Ubuntu", sans-serif; }</style>' +
              '<defs>' + patterns + '</defs>' +
              '<rect x="0" y="0" width="' + width + '" height="' + height + '" fill="' + colors.bg + '"/>' +
              blocks +
              '<text x="60" y="30" fill="' + colors.text + '" font-size="20" font-weight="bold">' + USERNAME + "'s GitHub Activity</text>" +
              '<text x="400" y="830" fill="' + colors.text + '" font-size="28" font-weight="bold" text-anchor="end">' + displayTotal + '</text>' +
              '<text x="410" y="830" fill="' + colors.textMuted + '" font-size="18">contributions</text>' +
              '<text x="1240" y="20" fill="' + colors.textMuted + '" font-size="14" text-anchor="end">' + firstDay + ' / ' + lastDay + '</text>' +
              '<g transform="translate(40, 520)"><g transform="translate(250, 0)">' + langBars + '</g></g>' +
              '</svg>';
          }
          
          generateSVG();
          ENDSCRIPT
          
          node generate-contrib.js
          
          echo "--- Generated SVG ---"
          head -3 assets/contrib-3d.svg
          echo "..."
          echo "File size: $(wc -c < assets/contrib-3d.svg) bytes"

      - name: Commit and push
        run: |
          git add assets/contrib-3d.svg .github/workflows/regenerate-svg.yml
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: regenerate contrib-3d.svg with correct GraphQL query [skip ci]"
            git push
            echo "SVG updated successfully!"
          fi
