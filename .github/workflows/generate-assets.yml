name: Generate Profile Assets

on:
  schedule:
    # Once daily at 00:00 UTC — frequent enough to stay current without
    # spamming the commit history (the old setup ran 3 jobs every 5 minutes).
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-assets.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate 3D contribution city SVG and activity graphs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install graphql-request graphql --no-save
          node .github/scripts/generate-3d.js
          node .github/scripts/generate-activity-graph.js
          ACTIVITY_GRAPH_THEME=github-dark OUTPUT_PATH=assets/activity-graph-dark.svg \
            node .github/scripts/generate-activity-graph.js

      - name: Generate snake animation SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg?palette=github-dark

      - name: Commit and push
        run: |
          git add assets/contrib-3d.svg assets/snake.svg assets/activity-graph.svg assets/activity-graph-dark.svg
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: regenerate profile SVG assets [skip ci]"
            git push
            echo "SVG assets updated"
          fi
