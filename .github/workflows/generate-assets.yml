name: Generate Profile Assets

on:
  schedule:
    # setiap 10 menit
    - cron: '2-59/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-assets.yml'

permissions:
  contents: write

concurrency:
  group: generate-assets
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate 3D contribution city SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install graphql-request graphql --no-save
          node .github/scripts/generate-3d.js

      - name: Generate snake animation SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg?palette=github-dark

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add assets/contrib-3d.svg assets/snake.svg
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # Simpan hasil generate dulu, lalu tulis ulang di atas commit terbaru remote
          # supaya push tidak ditolak saat workflow lain menulis ke main bersamaan.
          mkdir -p /tmp/assets
          cp assets/contrib-3d.svg assets/snake.svg /tmp/assets/

          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3 4 5; do
            git fetch --quiet "$remote" main
            git reset --quiet --hard FETCH_HEAD
            cp /tmp/assets/contrib-3d.svg /tmp/assets/snake.svg assets/

            git add assets/contrib-3d.svg assets/snake.svg
            if git diff --staged --quiet; then
              echo "Tidak ada perubahan untuk di-commit"
              exit 0
            fi
            git commit --quiet -m "chore: regenerate profile SVG assets [skip ci]"

            if git push --quiet "$remote" "HEAD:main"; then
              echo "Push berhasil pada percobaan $attempt"
              exit 0
            fi

            echo "Push ditolak (percobaan $attempt), menyinkron ulang..."
            sleep "$((RANDOM % 5 + 2))"
          done

          echo "Push gagal setelah 5 percobaan" >&2
          exit 1
