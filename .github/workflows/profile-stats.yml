name: Refresh Profile Stats

on:
  schedule:
    # setiap 10 menit
    - cron: '6-59/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run stats generator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: node .github/scripts/generate-stats.mjs

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add assets/stats.svg assets/top-langs.svg assets/streak.svg assets/trophies.svg
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # Isinya deterministik dari API GitHub, jadi simpan dulu lalu tulis
          # ulang di atas commit terbaru remote (menghindari konflik rebase).
          mkdir -p /tmp/stats
          cp assets/stats.svg assets/top-langs.svg assets/streak.svg assets/trophies.svg /tmp/stats/

          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3 4 5; do
            git fetch --quiet "$remote" main
            git reset --quiet --hard FETCH_HEAD
            cp /tmp/stats/stats.svg /tmp/stats/top-langs.svg /tmp/stats/streak.svg /tmp/stats/trophies.svg assets/

            git add assets/stats.svg assets/top-langs.svg assets/streak.svg assets/trophies.svg
            if git diff --staged --quiet; then
              echo "Tidak ada perubahan untuk di-commit"
              exit 0
            fi
            git commit --quiet -m "chore: refresh profile stats [skip ci]"

            if git push --quiet "$remote" "HEAD:main"; then
              echo "Push berhasil pada percobaan $attempt"
              exit 0
            fi

            echo "Push ditolak (percobaan $attempt), menyinkron ulang..."
            sleep "$((RANDOM % 5 + 2))"
          done

          echo "Push gagal setelah 5 percobaan" >&2
          exit 1
