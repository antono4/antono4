name: C1

permissions:
  contents: write

on:
  schedule:
    # Setiap 10 menit, offset 0 (menit 00, 10, 20, 30, 40, 50).
    - cron: '0-59/10 * * * *'
  workflow_dispatch:

concurrency:
  # Semua workflow penulis README berbagi grup ini agar tidak saling bentrok.
  group: readme-updater
  cancel-in-progress: false

jobs:
  update-repo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Configure Git
        run: |
          git config user.name "antono4"
          git config user.email "antonockr1@gmail.com"

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git pull --rebase origin ${{ github.ref_name }}
          export TZ="Asia/Jakarta"
          TIMESTAMP=$(date +"%Y-%m-%d %H:%M:%S %Z")
          echo "Last updated: $TIMESTAMP" > README.md
          git add README.md
          git commit -m "Auto update README at $(date +'%Y-%m-%d %H:%M:%S') WIB" || echo "No changes to commit"
          git push origin ${{ github.ref_name }}