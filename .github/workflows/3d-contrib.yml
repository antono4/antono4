name: Generate 3D Contribution SVG

permissions:
  contents: write

on:
  push:
    branches:
      - main
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  generate-3d-contrib:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate 3D Contribution SVG
        uses: yoshi389111/github-profile-3d-contrib@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Prepare output
        run: |
          mkdir -p assets
          ls -la profile-3d-contrib/ 2>/dev/null || echo "Checking output..."
          # Copy all generated files
          if [ -d "profile-3d-contrib" ]; then
            cp profile-3d-contrib/*.svg assets/ 2>/dev/null || true
          fi
          ls -la assets/ 2>/dev/null || true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push
        run: |
          git pull --rebase origin ${{ github.ref_name }}
          git add assets/
          git commit -m "Update 3D contribution SVG at $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes"
          git push origin ${{ github.ref_name }}
