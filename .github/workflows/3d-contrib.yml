name: Generate 3D Contribution SVG

permissions:
  contents: write

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  generate-3d-contrib:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate 3D Contribution SVG
        uses: yoshi389111/github-profile-3d-contrib@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          gh_username: ${{ github.repository_owner }}
          option_type: 1

      - name: Prepare output
        run: |
          mkdir -p assets
          cp profile-3d-contrib/profile-green-animate.svg assets/contrib-3d.svg 2>/dev/null || \
          cp profile-3d-contrib/profile-green.svg assets/contrib-3d.svg 2>/dev/null || true
          ls -la profile-3d-contrib/ 2>/dev/null || echo "No profile-3d-contrib folder"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push
        run: |
          git pull --rebase origin ${{ github.ref_name }}
          git add assets/contrib-3d.svg
          git commit -m "Update 3D contribution SVG at $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes"
          git push origin ${{ github.ref_name }}
