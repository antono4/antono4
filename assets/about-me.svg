<svg xmlns="http://www.w3.org/2000/svg" width="880" height="564" viewBox="0 0 880 564" fill="none" role="img" aria-labelledby="cardTitle cardDesc">
  <title id="cardTitle">Antono — About Me</title>
  <desc id="cardDesc">Profile card: role, background, what I build, and the tools I use.</desc>

  <style>
    /* Visible by default; motion is additive so the card never renders blank. */
    .f { animation: fade 0.5s cubic-bezier(0.2, 0.7, 0.3, 1) both; }
    .d1 { animation-delay: 0.05s; }
    .d2 { animation-delay: 0.13s; }
    .d3 { animation-delay: 0.21s; }
    .d4 { animation-delay: 0.29s; }
    .d5 { animation-delay: 0.37s; }
    .d6 { animation-delay: 0.45s; }
    .d7 { animation-delay: 0.53s; }
    .d8 { animation-delay: 0.61s; }
    .d9 { animation-delay: 0.69s; }
    @keyframes fade {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .f { animation: none; }
    }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111823"/>
    </linearGradient>

    <linearGradient id="avatar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#0ea5a4"/>
    </linearGradient>

    <clipPath id="card"><rect width="880" height="564" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="880" height="564" fill="url(#bg)"/>
    <rect x="0.5" y="0.5" width="879" height="563" rx="19.5" stroke="#21262d"/>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">

      <!-- ===== header ===== -->
      <g class="f d1">
        <circle cx="82" cy="98" r="34" fill="url(#avatar)"/>
        <text x="82" y="98" text-anchor="middle" dominant-baseline="central" font-size="30" font-weight="700" fill="#ffffff">A</text>

        <text x="136" y="90" font-size="26" font-weight="700" fill="#e6edf3" letter-spacing="-0.4">Antono</text>
        <text x="136" y="116" font-size="14.5" fill="#8b949e">Full-Stack Developer · AI &amp; Automation</text>

        <rect x="136" y="128" width="20" height="7" rx="1" fill="#ce1126"/>
        <rect x="136" y="135" width="20" height="7" rx="1" fill="#f0f6fc"/>
        <rect x="136" y="128" width="20" height="14" rx="1" fill="none" stroke="#30363d" stroke-width="1"/>
        <text x="164" y="140" font-size="13.5" fill="#8b949e">Indonesia</text>

        <text x="832" y="98" text-anchor="end" font-size="13.5" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">github.com/antono4</text>
      </g>

      <!-- ===== divider ===== -->
      <g class="f d2">
        <rect x="48" y="166" width="784" height="1" fill="#21262d"/>
        <rect x="48" y="166" width="64" height="2" rx="1" fill="#58a6ff"/>
      </g>

      <!-- ===== body ===== -->
      <g font-size="19" fill="#c9d1d9">
        <text class="f d3" x="48" y="208">I'm a <tspan fill="#58a6ff" font-weight="700">Full-Stack Developer</tspan> based in <tspan fill="#58a6ff" font-weight="700">Indonesia</tspan>.</text>
        <text class="f d3" x="48" y="244">Background in <tspan fill="#58a6ff" font-weight="700">computational chemistry</tspan>, shipping</text>
        <text class="f d4" x="48" y="280"><tspan fill="#58a6ff" font-weight="700">production web systems</tspan> and <tspan fill="#58a6ff" font-weight="700">AI-powered tools</tspan> — from</text>
        <text class="f d4" x="48" y="316"><tspan fill="#58a6ff" font-weight="700">hospital</tspan> and <tspan fill="#58a6ff" font-weight="700">enterprise</tspan> platforms to <tspan fill="#58a6ff" font-weight="700">automation</tspan> pipelines.</text>
        <text class="f d5" x="48" y="350" font-size="15" fill="#8b949e">I care about clean architecture, reliable delivery, and software that solves real problems.</text>
      </g>

      <!-- ===== skills ===== -->
      <g class="f d6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing="0.6" fill="#c9d1d9">
        <rect x="48" y="380" width="187" height="36" rx="10" fill="#161b22" stroke="#30363d"/>
        <circle cx="64" cy="398" r="3" fill="#58a6ff"/>
        <text x="76" y="403">FULL-STACK</text>

        <rect x="247" y="380" width="187" height="36" rx="10" fill="#161b22" stroke="#30363d"/>
        <circle cx="263" cy="398" r="3" fill="#a371f7"/>
        <text x="275" y="403">AI &amp; AUTOMATION</text>

        <rect x="446" y="380" width="187" height="36" rx="10" fill="#161b22" stroke="#30363d"/>
        <circle cx="462" cy="398" r="3" fill="#f0883e"/>
        <text x="474" y="403">CHEMISTRY</text>

        <rect x="645" y="380" width="187" height="36" rx="10" fill="#161b22" stroke="#30363d"/>
        <circle cx="661" cy="398" r="3" fill="#2dd4bf"/>
        <text x="673" y="403">LANGCHAIN</text>
      </g>

      <g class="f d7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing="0.6" fill="#c9d1d9">
        <rect x="48" y="422" width="187" height="36" rx="10" fill="#161b22" stroke="#30363d"/>
        <circle cx="64" cy="440" r="3" fill="#3fb950"/>
        <text x="76" y="445">FASTAPI</text>

        <rect x="247" y="422" width="187" height="36" rx="10" fill="#161b22" stroke="#30363d"/>
        <circle cx="263" cy="440" r="3" fill="#58a6ff"/>
        <text x="275" y="445">TYPESCRIPT</text>

        <rect x="446" y="422" width="187" height="36" rx="10" fill="#161b22" stroke="#30363d"/>
        <circle cx="462" cy="440" r="3" fill="#58a6ff"/>
        <text x="474" y="445">POSTGRES</text>

        <rect x="645" y="422" width="187" height="36" rx="10" fill="#161b22" stroke="#30363d"/>
        <circle cx="661" cy="440" r="3" fill="#58a6ff"/>
        <text x="673" y="445">DOCKER</text>
      </g>

      <g class="f d8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing="0.6" fill="#c9d1d9">
        <rect x="48" y="464" width="187" height="36" rx="10" fill="#161b22" stroke="#30363d"/>
        <circle cx="64" cy="482" r="3" fill="#e5534b"/>
        <text x="76" y="487">NESTJS</text>

        <rect x="247" y="464" width="187" height="36" rx="10" fill="#161b22" stroke="#30363d"/>
        <circle cx="263" cy="482" r="3" fill="#f0883e"/>
        <text x="275" y="487">LARAVEL</text>

        <rect x="446" y="464" width="187" height="36" rx="10" fill="#161b22" stroke="#30363d"/>
        <circle cx="462" cy="482" r="3" fill="#f0883e"/>
        <text x="474" y="487">AWS</text>

        <rect x="645" y="464" width="187" height="36" rx="10" fill="#161b22" stroke="#30363d"/>
        <circle cx="661" cy="482" r="3" fill="#58a6ff"/>
        <text x="673" y="487">GITHUB ACTIONS</text>
      </g>
    </g>
  </g>
</svg>
