<svg xmlns="http://www.w3.org/2000/svg" width="820" height="150" viewBox="0 0 820 150">
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; }
      .title { fill: #8be9fd; font-size: 18px; font-weight: bold; }
      .badge-text { fill: #f8f8f2; font-size: 11px; font-weight: 600; }
      .badge-value { fill: #f1fa8c; font-size: 20px; font-weight: bold; }
    </style>

    <rect width="820" height="150" fill="#282a36" rx="12"/>
    <text x="410" y="28" text-anchor="middle" class="title">🏆 GitHub Achievements</text>
    <line x1="50" y1="40" x2="770" y2="40" stroke="#44475a" stroke-width="1"/>

    <g transform="translate(60, 15)">
      <rect x="0" y="40" width="100" height="90" fill="#3d3d5c" rx="8"/>
      <text x="50" y="70" text-anchor="middle" class="badge-value">176</text>
      <text x="50" y="92" text-anchor="middle" fill="#bd93f9" font-size="16">⭐</text>
      <text x="50" y="112" text-anchor="middle" class="badge-text">Stars</text>
      <text x="50" y="125" text-anchor="middle" fill="#6272a4" font-size="9">Earned</text>
      <rect x="120" y="40" width="100" height="90" fill="#3d3d5c" rx="8"/>
      <text x="170" y="70" text-anchor="middle" class="badge-value">657</text>
      <text x="170" y="92" text-anchor="middle" fill="#50fa7b" font-size="16">🔀</text>
      <text x="170" y="112" text-anchor="middle" class="badge-text">PRs Merged</text>
      <text x="170" y="125" text-anchor="middle" fill="#6272a4" font-size="9">Pull Requests</text>
      <rect x="240" y="40" width="100" height="90" fill="#3d3d5c" rx="8"/>
      <text x="290" y="70" text-anchor="middle" class="badge-value">19</text>
      <text x="290" y="92" text-anchor="middle" fill="#ff79c6" font-size="16">📋</text>
      <text x="290" y="112" text-anchor="middle" class="badge-text">Issues</text>
      <text x="290" y="125" text-anchor="middle" fill="#6272a4" font-size="9">Contributed</text>
      <rect x="360" y="40" width="100" height="90" fill="#3d3d5c" rx="8"/>
      <text x="410" y="70" text-anchor="middle" class="badge-value">399</text>
      <text x="410" y="92" text-anchor="middle" fill="#8be9fd" font-size="16">📦</text>
      <text x="410" y="112" text-anchor="middle" class="badge-text">Repos</text>
      <text x="410" y="125" text-anchor="middle" fill="#6272a4" font-size="9">Public</text>
      <rect x="480" y="40" width="100" height="90" fill="#3d3d5c" rx="8"/>
      <text x="530" y="70" text-anchor="middle" class="badge-value">3</text>
      <text x="530" y="92" text-anchor="middle" fill="#ffb86c" font-size="16">👥</text>
      <text x="530" y="112" text-anchor="middle" class="badge-text">Followers</text>
      <text x="530" y="125" text-anchor="middle" fill="#6272a4" font-size="9">GitHub</text>
      <rect x="600" y="40" width="100" height="90" fill="#3d3d5c" rx="8"/>
      <text x="650" y="70" text-anchor="middle" class="badge-value">415K</text>
      <text x="650" y="92" text-anchor="middle" fill="#ff5555" font-size="16">🚀</text>
      <text x="650" y="112" text-anchor="middle" class="badge-text">Commits</text>
      <text x="650" y="125" text-anchor="middle" fill="#6272a4" font-size="9">Last Year</text>
    </g>
  </svg>
